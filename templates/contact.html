<!-- PROFILE -->

<!-- FORM -->
<div class="contact-form glass">
  <h2 data-i18n-block="b0fde615a0f445f">Let’s Chat</h2>
  <p data-i18n-block="b0c831a1b8fa01e">Open for research collaborations, internships, consulting, and technical discussions.</p>

  <form id="contact-form" action="https://formspree.io/f/mnjbzwav" method="POST">

    <label>Your Email
      <input type="email" name="email" required placeholder="you@example.com">
    </label>

    <label>Organization
      <input type="text" name="organization" placeholder="Company / University">
    </label>

    <label>Message
      <textarea name="message" rows="4" required placeholder="Hi Munad…"></textarea>
    </label>

    <input type="hidden" name="_subject" value="New Portfolio Message">

    <button type="submit" class="btn">Send Message</button>

    <!-- SUCCESS MESSAGE -->
    <div id="successMessage" class="success-message" role="status" aria-live="polite">
      ✅ Your message has been sent successfully!
    </div>
    <p id="errorMessage" role="alert" hidden></p>

  </form>

  <p class="direct" data-i18n-block="b5f4c9342aa0d31">
    Or email me directly at
    <a href="mailto:munadali17@gmail.com" style="color:#ff8c00; font-weight:600;">
  munadali17@gmail.com
</a>

  </p>
</div>

<footer class="footer container">
© <span id="year"></span> Munad E Ali
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const form = document.getElementById("contact-form");
const successMessage = document.getElementById("successMessage");
const errorMessage = document.getElementById("errorMessage");
const submitButton = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  if (submitButton.disabled) return;
  submitButton.disabled = true;
  submitButton.textContent = "Sending...";
  successMessage.style.display = "none";
  errorMessage.hidden = true;
  try {
    const response = await fetch(form.action, {
      method: form.method,
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
    if (!response.ok) throw new Error('Message delivery failed');
    form.reset();
    successMessage.style.display = "block";
  } catch (error) {
    errorMessage.textContent = "Your message could not be sent. Please try again or use the email link below.";
    errorMessage.hidden = false;
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Send Message";
  }
});
</script>
